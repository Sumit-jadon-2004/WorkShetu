<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ws-tab-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b7a42"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#0e4423"/>
    </linearGradient>
    <linearGradient id="ws-sprout-grad" x1="42" y1="10" x2="56" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Title Icon Background: Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#ws-tab-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Golden Accent Sprout in top-right corner -->
  <path d="M48 10 C48 16 43 20 38 21 C38 15 42 11 48 10 Z" fill="url(#ws-sprout-grad)"/>
  <path d="M48 10 C51 13 54 18 53 23 C48 23 46 19 48 10 Z" fill="#4ade80"/>

  <!-- Tractor Body & Wheels (Vector optimized for browser tab clarity) -->
  <!-- Rear Big Wheel -->
  <circle cx="21" cy="43" r="10" stroke="#ffffff" stroke-width="3.5" fill="#0e4423"/>
  <circle cx="21" cy="43" r="4.5" fill="#facc15"/>

  <!-- Front Small Wheel -->
  <circle cx="47" cy="45" r="7" stroke="#ffffff" stroke-width="3" fill="#0e4423"/>
  <circle cx="47" cy="45" r="3" fill="#facc15"/>

  <!-- Tractor Chassis / Hood / Cabin -->
  <path d="M12 43 H10 C9.4 43 9 42.6 9 42 L10 27 C10 25.9 10.9 25 12 25 H24 C25.1 25 26 25.9 26 27 V35 H42 L48 37 C49.1 37.4 50 38.4 50 39.5 V43 H40" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Cabin Window / Roof -->
  <path d="M14 25 L16 16 C16.2 15.4 16.8 15 17.5 15 H27.5 C28.3 15 29 15.7 29 16.5 V35" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Exhaust Pipe -->
  <path d="M37 25 V21 C37 20.4 37.4 20 38 20 H40" 
        stroke="#facc15" 
        stroke-width="2.5" 
        stroke-linecap="round"/>

  <!-- Connecting Bridge Line (Shetu) under wheels -->
  <path d="M6 55 H58" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
